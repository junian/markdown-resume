head:
  title: Markdown Resume - Creador de Currículums Online Gratuito
  desc: Creador de currículums vitae en línea gratuito, te permite crear tu currículum en minutos con Markdown!
  keywords: creador de currículum, creador de cv, creador de curriculum vitae, currículum markdown, resume.md

landing:
  hero: Escribe tu <span text-brand>currículum</span> en Markdown!
  desc: es una herramienta gratuita y de código abierto creada para construir y gestionar tus currículums lo más fácilmente posible, sin perder la privacidad de tus datos.
  start: Crear Mi Currículum
  feats:
    - title: Simple y poderoso
      items: Gestiona múltiples currículums<br>Vista previa en tiempo real<br>Exportar a PDF<br>Exportar a HTML<br>Exportar a MS Word (beta)<br>Galería de imágenes<br>Totalmente personalizable<br>Elige fuentes y agrega íconos<br>Y <a href="https://github.com/junian/markdown-resume#features" target="_blank">más funciones</a>
    - title: Seguridad Primero
      items: Open source y gratuito<br>Los datos se guardan en local<br>No se requiere inicio de sesión ni registro<br>Tus datos nunca salen de tu dispositivo<br>Sin almacenamiento ni procesamiento en el servidor<br>Tus datos son siempre tuyos
  analytics_disclaimer: >
    Cuando se accede desde <a href="https://junian.dev/markdown-resume/" target="_blank" class="underline">junian.dev/markdown-resume/</a>,
    esta aplicación utiliza <strong>Google Analytics</strong> y <strong>Cloudflare Web Analytics</strong> para medir
    métricas de uso agregadas como visitas a páginas y usuarios activos. Tu currículum y tus imágenes nunca se recopilan ni se transmiten.
    Al usar esta aplicación, aceptas la <a href="https://junian.dev/privacy-policy/" target="_blank" class="underline">Política de Privacidad</a>.

