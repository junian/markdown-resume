head:
  title: Markdown Resume - 免费的在线简历制作工具
  desc: 免费的在线简历制作工具，使用 Markdown 轻松制作您的简历！
  keywords: Markdown 简历, 简历制作, 在线简历

landing:
  hero: 用 Markdown 写<span text-brand>简历</span>！
  desc: 是一款免费开源的工具，让您尽可能轻松地创建和管理简历，同时不丢失数据隐私。
  start: 开始制作简历
  feats:
    - title: 简单且强大
      items: 创建并管理多份简历<br>实时预览<br>导出为 PDF 格式<br>导出为 HTML<br>导出为 MS Word（测试版）<br>图片库<br>可定制程度高<br>轻松切换字体和添加图标<br>以及<a href="https://github.com/junian/markdown-resume#features" target="_blank">更多特性</a>
    - title: 隐私优先
      items: 开源且免费<br>数据保存在本地<br>无需登录或注册<br>您的数据永远不会离开您的设备<br>无服务器端存储或处理<br>您的数据始终属于您
  analytics_disclaimer: >
    通过 <a href="https://junian.dev/markdown-resume/" target="_blank" class="underline">junian.dev/markdown-resume/</a> 访问时，
    本应用会使用 <strong>Google Analytics</strong> 和 <strong>Cloudflare Web Analytics</strong> 来衡量浏览量、活跃用户等汇总使用指标。
    您的简历内容和图片绝不会被收集或传输。
    使用本应用即表示您同意 <a href="https://junian.dev/privacy-policy/" target="_blank" class="underline">隐私政策</a>。

